name: Build macOS

# 手动触发 或 推送 tag(v开头) 时触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install
          chmod +x node_modules/.bin/*

      - name: Build macOS (universal)
        run: wails build -platform darwin/universal -clean

      - name: Build Windows
        run: wails build -platform windows/amd64 -clean -s -skipbindings

      - name: Package DMG
        run: |
          APP=$(ls -d build/bin/*.app | head -n 1)
          if [ -z "$APP" ]; then
            echo "No .app found, listing build/bin:"
            ls -la build/bin/
            exit 1
          fi
          APP_NAME=$(basename "$APP" .app)
          echo "Found app: $APP"
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "build/bin/${APP_NAME}_darwin_universal.dmg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: mytools-build
          path: |
            build/bin/*.dmg
            build/bin/*.exe
          retention-days: 30

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/*.dmg
            build/bin/*.exe
