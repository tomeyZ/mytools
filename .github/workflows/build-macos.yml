name: Build macOS

# 手动触发 或 推送 tag(v开头) 时触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS (universal)
        run: wails build -platform darwin/universal -clean

      - name: Package DMG
        run: |
          APP="build/bin/MyTools.app"
          if [ ! -d "$APP" ]; then
            echo "MyTools.app not found, listing build/bin:"
            ls -la build/bin/
            exit 1
          fi
          hdiutil create -volname "MyTools" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "build/bin/MyTools_darwin_universal.dmg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mytools-macos
          path: |
            build/bin/*.dmg
            build/bin/*.app
          retention-days: 30

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.dmg
