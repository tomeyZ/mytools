name: Build and Release

# 手动触发 或 推送 tag(v开头) 时触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 两个平台各用原生 runner 构建，避免交叉编译：
# 原先在 macOS 上跑 `wails build -platform windows/amd64`，产物 exe 从未生成，
# 而 Release 步骤的文件 glob 不匹配时只告警不失败，导致静默发布了一个只有 dmg 的包
jobs:
  build-macos:
    name: Build macOS (dmg)
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install
          chmod +x node_modules/.bin/*

      - name: Build macOS (universal)
        run: wails build -platform darwin/universal -clean

      - name: Package DMG
        run: |
          APP=$(ls -d build/bin/*.app | head -n 1)
          if [ -z "$APP" ]; then
            echo "No .app found, listing build/bin:"
            ls -la build/bin/
            exit 1
          fi
          APP_NAME=$(basename "$APP" .app)
          echo "Found app: $APP"
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "build/bin/mytools_${VERSION}_darwin_universal.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          # 产物名必须唯一：actions/upload-artifact@v4+ 不允许同名重复上传
          name: mytools-macos
          path: build/bin/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows (exe)
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # 不带 -s：这个 job 是独立环境，必须自己构建前端产物并生成 wails 绑定
      - name: Build Windows
        run: wails build -platform windows/amd64 -clean

      - name: Rename to versioned filename
        shell: bash
        run: |
          EXE=$(ls build/bin/*.exe | head -n 1)
          if [ -z "$EXE" ]; then
            echo "No .exe found, listing build/bin:"
            ls -la build/bin/
            exit 1
          fi
          echo "Found exe: $EXE"
          mv "$EXE" "build/bin/mytools_${VERSION}_windows_amd64.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: mytools-windows
          path: build/bin/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: mytools-macos
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: mytools-windows
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # 显式发布为正式版：之前产出过 draft，客户端 API 查不到
          draft: false
          prerelease: false
          # 关键：文件缺失直接失败，避免再次出现「只有 dmg 没有 exe」的静默发布
          fail_on_unmatched_files: true
          files: |
            dist/**/*.dmg
            dist/**/*.exe
