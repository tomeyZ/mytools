<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>转换按钮图标候选</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f4f5f7;
    --border: #e6e9ee; --border-strong: #d3d7de;
    --text: #1a1f29; --text-3: #8c94a3;
    --accent: #4f46e5; --accent-strong: #4338ca;
    --accent-soft: #eef0fe; --accent-border: #dfe3fd;
    --radius-sm: 9px; --radius-xs: 6px;
  }
  :root[data-theme="dark"] {
    --bg: #0f141b; --surface: #141a22; --surface-2: #1a2029;
    --border: #232c38; --border-strong: #313b49;
    --text: #e6ebf2; --text-3: #6b7688;
    --accent: #22d3ee; --accent-strong: #67e8f9;
    --accent-soft: rgba(34,211,238,.11); --accent-border: rgba(34,211,238,.28);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 24px; background: var(--bg); color: var(--text);
         font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 1200px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 16px; }
  .cap { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .no { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 4px; padding: 1px 6px; }
  :root[data-theme="dark"] .no { color: #06222a; }
  .nm { font-size: 13px; font-weight: 650; }
  .sub { font-size: 11.5px; color: var(--text-3); }
  .rowline { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .rowline:last-child { margin-bottom: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    flex: none; height: 36px; padding: 0 16px; border: 1px solid transparent;
    border-radius: var(--radius-sm); font: inherit; font-size: 13px; font-weight: 600;
    white-space: nowrap; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  :root[data-theme="dark"] .btn.primary { color: #06222a; }
  .btn.soft { background: var(--accent-soft); color: var(--accent-strong); border-color: var(--accent-border); }

  .ci { display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        width: 30px; height: 30px; border-radius: var(--radius-xs);
        background: var(--accent-soft); color: var(--accent-strong); border: 1px solid var(--accent-border); }
  h2 { font-size: 14px; margin: 26px 0 10px; }
</style>

<style id="design-scroll-fix">
  html { height: auto !important; overflow: visible !important; }
  body { height: auto !important; min-height: 100vh; overflow: visible !important; }
</style>

</head>
<body>
<script>
  document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'light';
</script>

<h2>在真实按钮里对比（1×实尺寸）</h2>
<div class="grid" id="grid"></div>

<h2>放大 2.4×（看笔画密度）</h2>
<div class="grid" id="zoom"></div>

<script>
// 14px 按钮图标，stroke-width 2，currentColor
const S = (inner, w) => `<svg viewBox="0 0 24 24" width="${w||14}" height="${w||14}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;

const CANDS = [
  {
    no: 'A', nm: '现状：循环箭头', sub: 'refresh-cw · 刷新/重试语义',
    ico: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.51 15"/>',
    ci: 'A'
  },
  {
    no: 'B', nm: '左右双向箭头', sub: 'arrow-right-left · 互换/转换语义',
    ico: '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
    ci: 'B'
  },
  {
    no: 'C', nm: '上下双向箭头', sub: 'arrow-up-down · 你截图里那个',
    ico: '<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',
    ci: 'C'
  },
  {
    no: 'D', nm: '两端折返的循环', sub: 'repeat · 也偏刷新语义',
    ico: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
    ci: 'D'
  },
  {
    no: 'E', nm: '单向右箭头', sub: 'arrow-right · 方向明确但两张卡反向',
    ico: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    ci: 'E'
  },
  {
    no: 'F', nm: '斜向互换箭头', sub: 'arrow-left-right 的斜向变体',
    ico: '<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
    ci: 'F'
  }
];

// 卡片图标：16px / stroke-width 1.7
const S16 = (inner) => `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const CLOCK = '<circle cx="12" cy="12" r="8.7"/><path d="M12 6.6V12l4 2.5"/>';

const grid = document.getElementById('grid');
const zoom = document.getElementById('zoom');
grid.innerHTML = CANDS.map(c => `
  <div class="card">
    <div class="cap"><span class="no">${c.no}</span><span class="nm">${c.nm}</span></div>
    <div class="sub" style="margin:-8px 0 12px">${c.sub}</div>
    <div class="rowline">
      <span class="ci">${S16(CLOCK)}</span>
      <button class="btn primary">${S(c.ico)}转换</button>
    </div>
    <div class="rowline">
      <button class="btn soft">${S(c.ico)}转换</button>
      <span class="sub">soft 样式</span>
    </div>
  </div>`).join('');

zoom.innerHTML = CANDS.map(c => `
  <div class="card">
    <div class="cap"><span class="no">${c.no}</span><span class="nm">${c.nm}</span></div>
    <button class="btn primary" style="height:83px;padding:0 37px;gap:14px;font-size:30px;border-radius:21px">${S(c.ico, 32)}转换</button>
  </div>`).join('');
</script>
</body>
</html>
